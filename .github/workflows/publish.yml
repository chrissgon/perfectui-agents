# Publishes @chrissgon/perfectui-mcp to npm when the owner pushes a tag v<version>, then creates the
# GitHub release. No npm token exists anywhere: npm's trusted publishing exchanges this job's OIDC
# identity for a one-off credential (npmjs.com: package settings, Trusted Publisher = GitHub Actions,
# chrissgon/perfectui-agents, workflow publish.yml) and attaches provenance.
# npm lets a trusted publisher be configured only on a package that already exists, so the very
# first version is published by hand; this workflow then skips the publish (the version is already
# on npm) and only creates the release. Actions are pinned to a commit (a tag can be moved).
name: publish

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # contents: write creates the GitHub release; id-token: write is the identity npm's trusted
      # publishing checks instead of a stored token.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main, to check the tagged commit is on it
          persist-credentials: false
      # No dependency cache in a job that publishes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later. 11.21.0 runs on every Node 24 release;
      # npm 12 needs Node 24.15.0 or later.
      - name: npm with trusted publishing
        run: npm install -g npm@11.21.0

      - name: The tag matches package.json and is on main
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main"
            exit 1
          fi

      # The same checks as .github/workflows/checks.yml and the pre-commit hook.
      - name: Install
        run: npm ci
      - name: Secrets in the working tree
        run: python3 scripts/secret-scan/secret_scan.py
      - name: Types
        run: npm run typecheck
      - name: Tests (offline)
        run: npm test
      - name: Build
        run: npm run build
      - name: Package contents
        run: npm pack --dry-run

      # A prerelease (1.0.0-beta.0) must not take the latest dist-tag, or `npx` would resolve to it.
      - name: Pick the dist-tag and check the registry
        id: plan
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then dist=next; else dist=latest; fi
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
          # Anonymous registry read: 200 = this version exists, 404 = it does not, anything else stops.
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2f}/$version")
          case "$status" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$name@$version is already on npm; the publish step is skipped" ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "publishing $name@$version under the $dist dist-tag" ;;
            *)
              echo "::error::the npm registry answered HTTP $status for $name@$version"
              exit 1 ;;
          esac

      - name: Publish
        if: steps.plan.outputs.published == 'false'
        env:
          DIST_TAG: ${{ steps.plan.outputs.dist }}
        run: npm publish --tag "$DIST_TAG" --provenance --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          prerelease=""
          if [[ "$tag" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$tag" --verify-tag --title "$tag" --generate-notes $prerelease
