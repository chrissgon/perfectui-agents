# Version updates for what the project ships and for the pinned actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @types/node follows the Node major the project runs on (CI: node-version 24), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
