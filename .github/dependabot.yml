# Version updates for what the project ships and for the pinned actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Titles that pass the pull request title check (commitlint.config.js): "chore(deps): bump ...".
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node follows the Node major the project runs on (CI: node-version 24), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
