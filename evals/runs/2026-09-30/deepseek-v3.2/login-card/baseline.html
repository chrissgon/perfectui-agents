<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-header h1 {
            color: #2d3748;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .login-header p {
            color: #718096;
            font-size: 16px;
            font-weight: 400;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            color: #4a5568;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-field {
            width: 100%;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            color: #2d3748;
            transition: all 0.3s ease;
            background: #f8fafc;
        }
        .input-field:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .input-field::placeholder {
            color: #a0aec0;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .checkbox-group input[type="checkbox"]:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        .checkbox-group label {
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin: 0;
            text-transform: none;
            letter-spacing: 0;
        }
        .signin-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }
        .signin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .signin-button:active {
            transform: translateY(0);
        }
        .forgot-password {
            text-align: center;
            display: block;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
            padding: 12px;
        }
        .forgot-password:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
        }
        .toggle-password:hover {
            color: #4a5568;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: 16px;
            }
            .login-header h1 {
                font-size: 28px;
            }
            .input-field {
                padding: 14px;
            }
            .signin-button {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Sign in to your account to continue</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    class="input-field" 
                    placeholder="Enter your email"
                    required
                />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input 
                        type="password" 
                        id="password" 
                        class="input-field" 
                        placeholder="Enter your password"
                        required
                    />
                    <button type="button" class="toggle-password" id="togglePassword">Show</button>
                </div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="remember" />
                <label for="remember">Remember me</label>
            </div>
            <button type="submit" class="signin-button" id="signinButton">
                Sign In
            </button>
            <a href="#" class="forgot-password">Forgot password?</a>
        </form>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const signinButton = document.getElementById('signinButton');
            const rememberCheckbox = document.getElementById('remember');
            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? 'Show' : 'Hide';
            });
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const remember = rememberCheckbox.checked;
                if (!email || !password) {
                    alert('Please fill in all fields');
                    return;
                }
                if (!isValidEmail(email)) {
                    alert('Please enter a valid email address');
                    return;
                }
                signinButton.textContent = 'Signing in...';
                signinButton.disabled = true;
                setTimeout(() => {
                    alert(`Login successful!\nEmail: ${email}\nRemember me: ${remember}`);
                    signinButton.textContent = 'Sign In';
                    signinButton.disabled = false;
                }, 1500);
            });
            function isValidEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }
            const savedEmail = localStorage.getItem('loginEmail');
            if (savedEmail) {
                emailInput.value = savedEmail;
                rememberCheckbox.checked = true;
            }
            rememberCheckbox.addEventListener('change', function() {
                if (this.checked && emailInput.value) {
                    localStorage.setItem('loginEmail', emailInput.value);
                } else {
                    localStorage.removeItem('loginEmail');
                }
            });
            emailInput.addEventListener('input', function() {
                if (rememberCheckbox.checked && this.value) {
                    localStorage.setItem('loginEmail', this.value);
                }
            });
        });
    </script>
</body>
</html>
