<!DOCTYPE html>
<html lang="en" data-pui-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chrissgon/perfectui@1.0.0/dist/perfectui.css">
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 1rem;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin: 0;
        }
        
        .login-subtitle {
            color: #666;
            margin: 0.5rem 0 0;
            font-size: 0.875rem;
        }
        
        .field-spacing {
            margin-bottom: 1.5rem;
        }
        
        .forgot-password {
            text-align: right;
            margin-bottom: 1.5rem;
        }
        
        .signin-button {
            width: 100%;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="pui-card login-card">
            <div class="pui-card-header login-header">
                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Sign in to your account to continue</p>
            </div>
            <div class="pui-card-content">
                <form>
                    <div class="field-spacing">
                        <label class="pui-field-group">
                            <span>Email</span>
                            <input class="pui-input" type="email" placeholder="you@example.com" required>
                        </label>
                    </div>
                    
                    <div class="field-spacing">
                        <label class="pui-field-group">
                            <span>Password</span>
                            <input class="pui-input" type="password" placeholder="••••••••" required>
                        </label>
                    </div>
                    
                    <div class="remember-me">
                        <input type="checkbox" class="pui-checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    
                    <div class="forgot-password">
                        <a href="#" class="pui-btn pui-link pui-theme">Forgot password?</a>
                    </div>
                    
                    <button class="pui-btn pui-solid pui-theme signin-button" type="submit">
                        Sign in
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
